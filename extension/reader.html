<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- No <title> until reader.js sets one: the background reads the tab
       title as the paper's, and an untitled tab passes as a stand-in. -->
  <title></title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="reader-page">

<!-- A PDF the browser opened, shown in the library's reader (see reader.js) -->
<div class="pdf-backdrop" id="pdfBackdrop" hidden></div>
<aside id="pdfPanel" class="pdf-panel" aria-labelledby="pdfPanelTitle" hidden>
  <div class="pdf-panel-header">
    <div class="pdf-panel-title" id="pdfPanelTitle"></div>
    <button class="pdf-panel-btn" id="pdfPanelOpenTab" title="Open in Chrome's PDF viewer" aria-label="Open in Chrome's PDF viewer">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      </svg>
    </button>
    <button class="pdf-panel-btn" id="pdfPanelClose" title="Close" aria-label="Close" hidden></button>
  </div>
  <div class="pdf-panel-body" id="pdfPanelBody" tabindex="-1"></div>
</aside>

<script src="papers.js"></script>
<script src="store.js"></script>
<script type="module" src="vendor/lector-panel.js"></script>
<script type="module" src="viewer.js"></script>
<script type="module" src="reader.js"></script>
<script src="translate.js"></script>
<script src="chat.js"></script>
</body>
</html>
