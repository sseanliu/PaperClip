<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <div class="popup-title">Save this tab to a paper</div>
      <div class="popup-current" id="popupCurrent"></div>
    </div>

    <div class="popup-search-wrap">
      <input id="popupSearch" type="search" placeholder="Search library…" autocomplete="off">
    </div>

    <div class="popup-list" id="popupList"></div>
    <div class="popup-message" id="popupMessage" style="display:none"></div>
  </div>

  <script src="papers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
