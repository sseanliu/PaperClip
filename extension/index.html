<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaperClip</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <h1 id="greeting"></h1>
      <div class="date" id="dateDisplay"></div>
    </div>
  </header>

  <section id="paperLibrary" class="paper-library">
    <div class="section-header">
      <h2>Library</h2>
      <div class="section-line"></div>
      <div class="section-count" id="paperCount"></div>
    </div>

    <div class="paper-search-wrap">
      <svg class="paper-search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" id="paperSearch" placeholder="Search by title, author, venue…" autocomplete="off">
    </div>

    <div id="paperList" class="paper-list"></div>

    <div id="paperEmpty" class="paper-empty" style="display:none">
      <div data-empty-state="initial">
        <p class="paper-empty-title">No papers yet.</p>
        <p class="paper-empty-sub">Open an arXiv page, an OpenReview submission, or any PDF and it'll show up here automatically.</p>
      </div>
      <div data-empty-state="no-results" style="display:none">
        <p class="paper-empty-title">No matches.</p>
        <p class="paper-empty-sub">Try a different search.</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="last-refresh">
      <span style="color: var(--muted); font-size: 11px;">
        <a href="https://github.com/sseanliu/PaperClip" target="_top" style="color: var(--muted); text-decoration: underline; text-underline-offset: 2px;">PaperClip</a>
      </span>
    </div>
  </footer>

</div>

<!-- URL classifier — must load before app.js -->
<script src="papers.js"></script>
<script src="app.js"></script>
</body>
</html>
